name: Build Asoka Blue iOS (Free Cloud Build)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-simulator:
    name: Build iOS Simulator App
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          ls -la AsokaBlue.xcodeproj

      - name: Build App for iOS Simulator
        run: |
          mkdir -p build/Release-iphonesimulator
          xcodebuild build \
            -project AsokaBlue.xcodeproj \
            -target AsokaBlue \
            -sdk iphonesimulator \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="${PWD}/build/Release-iphonesimulator"

      - name: Package App for Appetize.io & Simulator
        run: |
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app directory found in build!"
            exit 1
          fi
          APP_DIR=$(dirname "$APP_PATH")
          APP_NAME=$(basename "$APP_PATH")
          cd "$APP_DIR"
          zip -r "${GITHUB_WORKSPACE}/AsokaBlue-Simulator.zip" "$APP_NAME"
          ls -lh "${GITHUB_WORKSPACE}/AsokaBlue-Simulator.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsokaBlue-iOS-Simulator
          path: AsokaBlue-Simulator.zip
          retention-days: 14
