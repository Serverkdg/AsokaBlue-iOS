name: Build Asoka Blue iOS (Free Cloud Build)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-simulator:
    name: Build iOS Simulator App
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Xcode Environment
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-path

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: List Xcode Schemes
        run: xcodebuild -project AsokaBlue.xcodeproj -list

      - name: Build App for iOS Simulator
        run: |
          mkdir -p build/Release-iphonesimulator
          xcodebuild clean build \
            -project AsokaBlue.xcodeproj \
            -scheme AsokaBlue \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="${PWD}/build/Release-iphonesimulator"

      - name: Package App for Appetize.io & Simulator
        run: |
          cd build/Release-iphonesimulator
          zip -r ../../AsokaBlue-Simulator.zip AsokaBlue.app
          ls -la ../../AsokaBlue-Simulator.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsokaBlue-iOS-Simulator
          path: AsokaBlue-Simulator.zip
          retention-days: 14
